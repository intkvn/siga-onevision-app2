<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}SIGA → One Visión{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    {% if request.session.get("logueado") %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">SIGA → One Visión</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/pecosas">Pecosas</a>
                <a class="nav-link" href="/normalizacion">Normalización</a>
                <a class="nav-link" href="/maestros">Maestros</a>
                <a class="nav-link" href="/impresion">Impresión QR</a>
                <a class="nav-link" href="/control">Control General</a>
                <a class="nav-link" href="/verificacion">Verificación</a>
                <a class="nav-link" href="/carga-inicial">Carga Inicial</a>
                <a class="nav-link" href="/logout">Salir</a>
            </div>
        </div>
    </nav>
    {% endif %}
    <div class="container pb-5">
        {% block contenido %}{% endblock %}
    </div>
</body>
</html>
